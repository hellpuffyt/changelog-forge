<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">changelog-forge data flow</title>
  <desc id="d">Commits are read from git by RealGitReader, then engine.ts finds the previous release tag by semver, parses conventional commits, cancels reverts, infers the bump, groups by impact and scope, and collects contributors. The result is rendered as Markdown or JSON and written to stdout, a file, or prepended into CHANGELOG.md.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A3AAA6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3FBF8A"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#0C0D0D"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#A3AAA6">
    <text x="30" y="40" font-size="15" fill="#EEEAE2">changelog-forge · src/ data flow</text>
    <text x="30" y="76">INPUT</text>
    <text x="270" y="76">src/engine.ts · generateChangelog()</text>
    <text x="960" y="76">OUTPUT</text>
  </g>

  <!-- Input column -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="30" y="90" width="200" height="64" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="46" y="117" font-size="14" fill="#EEEAE2">git repository</text>
    <text x="46" y="139" font-size="12" fill="#A3AAA6">--cwd, --from, --to</text>

    <rect x="30" y="186" width="200" height="96" rx="6" fill="#17191A" stroke="#3FBF8A"/>
    <text x="46" y="212" font-size="14" fill="#EEEAE2">RealGitReader</text>
    <text x="46" y="234" font-size="12" fill="#A3AAA6">execFile git, no shell</text>
    <text x="46" y="252" font-size="12" fill="#A3AAA6">for-each-ref · log</text>
    <text x="46" y="270" font-size="12" fill="#A3AAA6">rev-parse</text>

    <rect x="30" y="306" width="200" height="56" rx="6" fill="#0C0D0D" stroke="#2A2E2D" stroke-dasharray="5 4"/>
    <text x="46" y="330" font-size="13" fill="#EEEAE2">FixtureGitReader</text>
    <text x="46" y="349" font-size="12" fill="#A3AAA6">in-memory, for tests</text>
    <text x="30" y="388" font-size="12" fill="#A3AAA6">both implement GitReader</text>
  </g>
  <line x1="130" y1="154" x2="130" y2="182" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="230" y1="234" x2="276" y2="164" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Engine container -->
  <rect x="270" y="90" width="640" height="300" rx="8" fill="none" stroke="#2A2E2D"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- row 1 -->
    <rect x="290" y="110" width="186" height="80" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="304" y="136" font-size="13" fill="#EEEAE2">version.ts</text>
    <text x="304" y="157" font-size="12" fill="#A3AAA6">findPreviousTag</text>
    <text x="304" y="175" font-size="12" fill="#A3AAA6">highest semver tag</text>

    <rect x="497" y="110" width="186" height="80" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="511" y="136" font-size="13" fill="#EEEAE2">parser.ts</text>
    <text x="511" y="157" font-size="12" fill="#A3AAA6">type(scope)!: subject</text>
    <text x="511" y="175" font-size="12" fill="#A3AAA6">body + footers</text>

    <rect x="704" y="110" width="186" height="80" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="718" y="136" font-size="13" fill="#EEEAE2">revert.ts</text>
    <text x="718" y="157" font-size="12" fill="#A3AAA6">cancelReverts</text>
    <text x="718" y="175" font-size="12" fill="#A3AAA6">commit + revert drop</text>

    <!-- row 2 -->
    <rect x="704" y="230" width="186" height="80" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="718" y="256" font-size="13" fill="#EEEAE2">version.ts</text>
    <text x="718" y="277" font-size="12" fill="#A3AAA6">inferBump</text>
    <text x="718" y="295" font-size="12" fill="#A3AAA6">major · minor · patch</text>

    <rect x="497" y="230" width="186" height="80" rx="6" fill="#17191A" stroke="#3FBF8A"/>
    <text x="511" y="256" font-size="13" fill="#EEEAE2">grouping.ts</text>
    <text x="511" y="277" font-size="12" fill="#A3AAA6">breaking first, then</text>
    <text x="511" y="295" font-size="12" fill="#A3AAA6">feat · fix · perf · …</text>

    <rect x="290" y="230" width="186" height="80" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="304" y="256" font-size="13" fill="#EEEAE2">contributors.ts</text>
    <text x="304" y="277" font-size="12" fill="#A3AAA6">dedupe by email</text>
    <text x="304" y="295" font-size="12" fill="#A3AAA6">exclude bots</text>

    <text x="511" y="214" font-size="11" fill="#A3AAA6">non-conventional → skipped[]</text>

    <!-- config -->
    <rect x="290" y="330" width="600" height="44" rx="6" fill="#0C0D0D" stroke="#2A2E2D"/>
    <text x="304" y="357" font-size="12" fill="#A3AAA6"><tspan fill="#EEEAE2">config.ts</tspan>  --config JSON + flags: scopeAliases, botPatterns, excludeTypes</text>
  </g>
  <line x1="476" y1="150" x2="493" y2="150" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="683" y1="150" x2="700" y2="150" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="797" y1="190" x2="797" y2="226" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="704" y1="270" x2="687" y2="270" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="497" y1="270" x2="480" y2="270" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- engine -> render -->
  <line x1="910" y1="193" x2="956" y2="193" stroke="#3FBF8A" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="914" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6">data</text>

  <!-- Output column -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="960" y="90" width="210" height="96" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="976" y="116" font-size="13" fill="#EEEAE2">render/markdown.ts</text>
    <text x="976" y="137" font-size="12" fill="#A3AAA6">Keep a Changelog</text>
    <text x="976" y="155" font-size="12" fill="#A3AAA6">+ links.ts: sha, PR,</text>
    <text x="976" y="173" font-size="12" fill="#A3AAA6">issue URLs</text>

    <rect x="960" y="200" width="210" height="56" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="976" y="224" font-size="13" fill="#EEEAE2">render/json.ts</text>
    <text x="976" y="243" font-size="12" fill="#A3AAA6">--format json</text>

    <rect x="960" y="276" width="210" height="114" rx="6" fill="#0C0D0D" stroke="#2A2E2D"/>
    <text x="976" y="301" font-size="12" fill="#EEEAE2">stdout (default)</text>
    <text x="976" y="325" font-size="12" fill="#EEEAE2">--out &lt;path&gt;</text>
    <text x="976" y="349" font-size="12" fill="#EEEAE2">--prepend [path]</text>
    <text x="976" y="369" font-size="11" fill="#A3AAA6">prepend.ts → CHANGELOG.md</text>
  </g>
  <line x1="1065" y1="256" x2="1065" y2="272" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="30" y="440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#A3AAA6">Everything inside engine.ts is pure logic over plain data; only RealGitReader touches git, and only the output step writes a file.</text>
</svg>
