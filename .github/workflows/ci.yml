name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Test (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Set up Node ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: "Smoke test: run built CLI against a real temp repo"
        shell: bash
        run: |
          set -e
          tmp_repo=$(mktemp -d)
          cd "$tmp_repo"
          git init -q
          git symbolic-ref HEAD refs/heads/main
          git config user.name "CI Bot"
          git config user.email "ci@example.com"
          echo one > a.txt && git add . && git commit -q -m "feat: add first feature"
          echo two > b.txt && git add . && git commit -q -m "fix: correct a bug"
          cd - > /dev/null
          node dist/cli.js --cwd "$tmp_repo" --repo-url https://github.com/example/example
